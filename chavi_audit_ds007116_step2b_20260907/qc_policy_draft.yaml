snapshot: "1.0.6"
recommended_primary:
  require_all_applicable_qc_fields: true
  accepted_code_meaning: valid_or_task_documented_likely_valid
  excluded_code_meaning: invalid_or_skipped
  unresolved_codes: [0, C, VC, unknown, missing, partial]
  missing_or_partial_qc: unresolved
strict_sensitivity:
  require_all_applicable_qc_fields: true
  accepted_codes: [V]
unresolved_qc_inclusive_sensitivity:
  retain_nonmissing_score_if: missing_or_partial_qc_or_unresolved_code
code_classes:
  V: valid
  F: task-specific; never assumed
  N_X_S: invalid_or_skipped
  0_C_VC_unknown: unresolved
