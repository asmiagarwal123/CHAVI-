    include: ["documented_valid", "documented_likely_valid", "no_automatic_validation", "comment_conditional", "unknown_or_undocumented", "missing_qc", "partial_qc", "no_applicable_qc_field"]
    exclude: ["documented_invalid", "documented_skipped"]
